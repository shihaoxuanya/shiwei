<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>拾微 · 发布管理</title><link rel="stylesheet" href="/admin/static/style.css"><script type="module" src="/admin/static/app.js"></script></head>
<body><aside><a class="brand" href="/admin">拾微 <small>SHIWEI</small></a><p class="nav-active">版本管理</p><p class="boundary">只管理版本发布<br>不接收用户知识内容</p></aside><main><header><div><p class="eyebrow">拾微 · 发布控制台</p><h1>版本管理</h1></div><button id="logout" hidden>退出登录</button></header><p id="message" role="status" aria-live="polite"></p><div id="view"><p>正在检查登录状态…</p></div></main><dialog id="confirmation" aria-labelledby="confirm-title"><form id="confirm-form"><h2 id="confirm-title">确认发布操作</h2><p id="confirm-summary"></p><label>输入版本号以确认<input name="confirm_version" required autocomplete="off"></label><label>操作原因<textarea name="reason" required maxlength="500" rows="3"></textarea></label><p id="confirm-error" role="alert"></p><footer><button type="button" id="cancel">取消</button><button type="submit" class="primary">确认执行</button></footer></form></dialog></body></html>
