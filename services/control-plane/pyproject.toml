[project]
name = "shiwei-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.40,<1", "argon2-cffi>=25,<26", "semver>=3,<4", "httpx>=0.28,<1", "pynacl>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shiwei_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
